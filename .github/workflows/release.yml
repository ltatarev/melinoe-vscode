name: Publish to VSC Marketplace

# Publish when a GitHub release is published.
# Authentication uses Marketplace Trusted Publishing (GitHub OIDC), so no PAT secret is necessary.
on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx @vscode/vsce publish --oidc
